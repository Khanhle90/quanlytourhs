<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TẠO FILE PDF CCCD 2 MẶT</title>
    <!-- Tải thư viện Tailwind CSS để làm đẹp giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tải thư viện jsPDF để tạo file PDF phía client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-lg mx-auto">
        <h1 class="text-2xl sm:text-3xl font-bold text-center mb-6 text-blue-700">
            TẠO FILE PDF CCCD 2 MẶT
        </h1>

        <!-- Form nhập liệu -->
        <form id="pdf-form" class="space-y-6">
            <!-- Mục nhập Họ và Tên -->
            <div>
                <label for="ho-ten" class="block text-sm font-medium text-gray-800 mb-2">
                    Họ và tên (dùng làm tên file)
                </label>
                <input type="text" id="ho-ten" name="ho-ten"
                       placeholder="Ví dụ: Nguyễn Văn A"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200"
                       required>
            </div>

            <!-- Mục tải ảnh Mặt trước -->
            <div>
                <label for="mat-truoc" class="block text-sm font-medium text-gray-800 mb-2">
                    Mặt trước
                </label>
                <input type="file" id="mat-truoc" name="mat-truoc"
                       accept="image/*"
                       class="block w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition duration-200"
                       required>
            </div>

            <!-- Mục tải ảnh Mặt sau -->
            <div>
                <label for="mat-sau" class="block text-sm font-medium text-gray-800 mb-2">
                    Mặt sau
                </label>
                <input type="file" id="mat-sau" name="mat-sau"
                       accept="image/*"
                       class="block w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-pink-50 file:text-pink-700 hover:file:bg-pink-100 transition duration-200"
                       required>
            </div>

            <!-- Nút Tạo PDF -->
            <button type="submit" id="create-pdf-btn"
                    class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold text-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all duration-300 ease-in-out transform hover:-translate-y-0.5 shadow-md hover:shadow-lg disabled:bg-gray-400 disabled:cursor-not-allowed">
                Tạo PDF
            </button>
        </form>

        <!-- Vùng hiển thị thông báo trạng thái -->
        <div id="status-message" class="hidden mt-4 text-center p-3 rounded-lg"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Lấy các phần tử DOM
            const pdfForm = document.getElementById('pdf-form');
            const hoTenInput = document.getElementById('ho-ten');
            const matTruocInput = document.getElementById('mat-truoc');
            const matSauInput = document.getElementById('mat-sau');
            const createPdfBtn = document.getElementById('create-pdf-btn');
            const statusMessage = document.getElementById('status-message');

            /**
             * Hàm trợ giúp: Đọc file thành Data URL (sử dụng Promise)
             * @param {File} file - File ảnh cần đọc
             * @returns {Promise<string>} - Promise giải quyết với Data URL của ảnh
             */
            function readFileAsDataURL(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = (error) => reject(error);
                    reader.readAsDataURL(file);
                });
            }

            /**
             * Hàm trợ giúp: Lấy kích thước thật của ảnh từ Data URL
             * @param {string} dataUrl - Data URL của ảnh
             * @returns {Promise<{width: number, height: number}>} - Promise giải quyết với object chứa width và height
             */
            function getImageDimensions(dataUrl) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        resolve({ width: img.width, height: img.height });
                    };
                    img.onerror = (error) => reject(error);
                    img.src = dataUrl;
                });
            }

            /**
             * Hàm hiển thị thông báo cho người dùng
             * @param {string} message - Nội dung thông báo
             * @param {'success' | 'error' | 'loading'} type - Loại thông báo
             */
            function showMessage(message, type) {
                statusMessage.textContent = message;
                // Reset classes
                statusMessage.className = 'mt-4 text-center p-3 rounded-lg font-medium';
                
                if (type === 'success') {
                    statusMessage.classList.add('text-green-700', 'bg-green-100');
                } else if (type === 'error') {
                    statusMessage.classList.add('text-red-700', 'bg-red-100');
                } else if (type === 'loading') {
                    statusMessage.classList.add('text-blue-700', 'bg-blue-100');
                }
                
                statusMessage.classList.remove('hidden');
            }

            /**
             * Hàm chuẩn hóa tên file
             * @param {string} name - Tên gốc
             * @returns {string} - Tên file đã chuẩn hóa
             */
            function sanitizeFileName(name) {
                // Xóa các ký tự không hợp lệ, thay dấu cách bằng dấu gạch dưới
                let fileName = name.replace(/[^a-z0-9\s-]/gi, '').trim().replace(/\s+/g, '_');
                // Nếu tên rỗng, dùng tên mặc định
                if (!fileName) {
                    fileName = 'CCCD_2_mat';
                }
                return fileName + '.pdf';
            }

            /**
             * Hàm kiểm tra thiết bị di động
             * @returns {boolean} - True nếu là di động, false nếu là máy tính
             */
            function isMobile() {
                try {
                    // Kiểm tra userAgent để phát hiện các thiết bị di động phổ biến
                    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                } catch (e) {
                    return false; // An toàn phòng trường hợp userAgent không có sẵn
                }
            }

            // Thêm trình xử lý sự kiện 'submit' cho form
            pdfForm.addEventListener('submit', async (e) => {
                e.preventDefault(); // Ngăn form gửi đi theo cách truyền thống

                // Lấy giá trị từ các trường input
                const hoTen = hoTenInput.value.trim();
                const fileMatTruoc = matTruocInput.files[0];
                const fileMatSau = matSauInput.files[0];

                // --- Kiểm tra dữ liệu đầu vào ---
                if (!hoTen) {
                    showMessage('Vui lòng nhập Họ và tên.', 'error');
                    hoTenInput.focus();
                    return;
                }
                if (!fileMatTruoc) {
                    showMessage('Vui lòng tải lên ảnh Mặt trước.', 'error');
                    matTruocInput.focus();
                    return;
                }
                if (!fileMatSau) {
                    showMessage('Vui lòng tải lên ảnh Mặt sau.', 'error');
                    matSauInput.focus();
                    return;
                }
                // --- Kết thúc kiểm tra ---

                // Vô hiệu hóa nút bấm và hiển thị thông báo tải
                createPdfBtn.disabled = true;
                createPdfBtn.textContent = 'Đang xử lý...';
                showMessage('Đang tạo file PDF, vui lòng đợi...', 'loading');

                try {
                    // Lấy đối tượng jsPDF từ global window (được nạp từ CDN)
                    const { jsPDF } = window.jspdf;

                    // Đọc cả hai file ảnh cùng lúc
                    const [matTruocDataUrl, matSauDataUrl] = await Promise.all([
                        readFileAsDataURL(fileMatTruoc),
                        readFileAsDataURL(fileMatSau)
                    ]);

                    // Lấy kích thước của ảnh mặt trước để đặt kích thước cho trang PDF
                    // Điều này đảm bảo PDF có kích thước vừa với ảnh quét
                    const dim1 = await getImageDimensions(matTruocDataUrl);
                    
                    const pdfWidth = dim1.width;
                    const pdfHeight = dim1.height;

                    // Tạo file PDF với đơn vị 'px' và kích thước bằng ảnh đầu tiên
                    const doc = new jsPDF({
                        orientation: pdfWidth > pdfHeight ? 'l' : 'p', // 'landscape' hoặc 'portrait'
                        unit: 'px',
                        format: [pdfWidth, pdfHeight]
                    });

                    // Thêm ảnh mặt trước vào trang đầu tiên, vừa khít trang
                    doc.addImage(matTruocDataUrl, 'AUTO', 0, 0, pdfWidth, pdfHeight);

                    // Thêm trang mới với cùng kích thước
                    doc.addPage([pdfWidth, pdfHeight]);

                    // Thêm ảnh mặt sau vào trang thứ hai, vừa khít trang
                    // (jsPDF sẽ tự động co giãn nếu ảnh 2 có kích thước khác)
                    doc.addImage(matSauDataUrl, 'AUTO', 0, 0, pdfWidth, pdfHeight);

                    // Chuẩn bị tên file
                    const fileName = sanitizeFileName(hoTen);

                    // Xử lý lưu file:
                    // - Trên máy tính: Tự động tải file
                    // - Trên di động: Mở PDF ở tab mới (đáng tin cậy hơn)
                    if (isMobile()) {
                        doc.output('dataurlnewwindow');
                        // Hiển thị thông báo thành công cho di động
                        showMessage('Tạo PDF thành công! File sẽ mở ở tab mới.', 'success');
                    } else {
                        // Lưu file PDF (trình duyệt sẽ tự động tải về)
                        doc.save(fileName);
                        // Hiển thị thông báo thành công
                        showMessage('Tạo PDF thành công! File đang được tải về.', 'success');
                    }

                } catch (error) {
                    // Xử lý nếu có lỗi xảy ra
                    console.error("Lỗi khi tạo PDF:", error);
                    showMessage('Đã xảy ra lỗi. Vui lòng thử lại.', 'error');
                } finally {
                    // Luôn luôn kích hoạt lại nút bấm sau khi hoàn tất
                    createPdfBtn.disabled = false;
                    createPdfBtn.textContent = 'Tạo PDF';
                }
            });
        });
    </script>

</body>
</html>
