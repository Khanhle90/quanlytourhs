<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản Lý Xe Tour</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 pb-16 font-sans antialiased">
  <script>
    // DÁN ĐƯỜNG LINK WEB APP GOOGLE VÀO ĐÂY:
    const API_URL = "https://script.google.com/macros/s/AKfycbwn1uto8BQqhSQ-AAINwc4nsJbUskZ_I5ZNGrJDnQALbSbtq-NjneGuEx4IfjQCPzPUXw/exec";
  </script>

  <div class="max-w-lg mx-auto p-4">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 rounded-2xl shadow-md mb-4 flex justify-between items-center">
      <div>
        <h1 class="font-bold text-lg leading-tight">ĐIỀU HÀNH SĨ SỐ XE</h1>
        <p class="text-xs text-blue-100">Cập nhật nhanh lộ trình & quân số</p>
      </div>
      <button type="button" onclick="promptAdmin()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold text-xs px-3.5 py-2 rounded-xl shadow border border-amber-300 flex items-center gap-1 transition-all active:scale-95">
        <span>🛡️ Admin</span>
      </button>
    </header>

    <!-- FORM DÀNH CHO HDV -->
    <div id="userSection">
      <form id="carForm" onsubmit="submitData(event)" class="space-y-4">
        <!-- Khối Tour & Số xe / Tên lớp -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Chương Trình</label>
            <select id="tour" required onchange="handleTourChange()" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="">-- Đang tải chương trình --</option>
            </select>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-xs font-bold text-slate-500 uppercase">Số Xe Hoặc Tên Lớp</label>
              <span id="lockBadge" class="hidden text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">Máy đã nhớ xe</span>
            </div>
            <input type="text" id="carInput" required 
                   placeholder="Nhập 01 (tự thêm Xe), nhập 12A1 (tự thêm Lớp)..." 
                   onblur="normalizeCarInput(this)" 
                   onchange="handleCarChange()" 
                   class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-bold text-blue-700 focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50">
            <p class="text-[11px] text-slate-400 mt-1">Gõ số tự thêm chữ <b>Xe</b>, gõ chữ tự thêm chữ <b>Lớp</b>.</p>
          </div>
        </div>

        <!-- Khối Nhân Sự -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
          <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Thông Tin Xe & Nhân Sự</h2>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-medium text-slate-600">Tên HDV</label>
              <input type="text" id="guide" required class="w-full mt-1 border border-slate-300 rounded-xl p-2 text-sm">
            </div>
            <div>
              <label class="text-xs font-medium text-slate-600">Biển Số Xe</label>
              <input type="text" id="plate" placeholder="29B-123.45" class="w-full mt-1 border border-slate-300 rounded-xl p-2 text-sm">
            </div>
            <div>
              <label class="text-xs font-medium text-slate-600">Họ Tên Lái Xe</label>
              <input type="text" id="driver" class="w-full mt-1 border border-slate-300 rounded-xl p-2 text-sm">
            </div>
            <div>
              <label class="text-xs font-medium text-slate-600">SĐT Lái Xe</label>
              <input type="tel" id="driverPhone" class="w-full mt-1 border border-slate-300 rounded-xl p-2 text-sm">
            </div>
          </div>
        </div>

        <!-- Sĩ số Lớp 1 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
          <div class="flex items-center justify-between border-b pb-2">
            <span class="text-xs font-bold text-blue-600 uppercase">Lớp Thứ Nhất</span>
            <input type="text" id="c1_name" placeholder="Tên lớp (12A1)" class="border border-slate-300 rounded-lg px-2.5 py-1 text-xs font-medium w-36">
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="text-[11px] text-slate-500 block text-center mb-1">Học Sinh</label>
              <input type="number" id="c1_hs" value="0" min="0" oninput="calcTotal()" class="w-full border border-slate-300 rounded-xl p-2 text-center text-sm font-bold">
            </div>
            <div>
              <label class="text-[11px] text-slate-500 block text-center mb-1">Phụ Huynh</label>
              <input type="number" id="c1_ph" value="0" min="0" oninput="calcTotal()" class="w-full border border-slate-300 rounded-xl p-2 text-center text-sm font-bold">
            </div>
            <div>
              <label class="text-[11px] text-slate-500 block text-center mb-1">Trẻ Em Đi Kèm</label>
              <input type="number" id="c1_te" value="0" min="0" oninput="calcTotal()" class="w-full border border-slate-300 rounded-xl p-2 text-center text-sm font-bold">
            </div>
          </div>
        </div>

        <!-- Sĩ số Lớp 2 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
          <div class="flex items-center justify-between border-b pb-2">
            <span class="text-xs font-bold text-emerald-600 uppercase">Lớp Thứ Hai (Nếu có)</span>
            <input type="text" id="c2_name" placeholder="Tên lớp ghép" class="border border-slate-300 rounded-lg px-2.5 py-1 text-xs font-medium w-36">
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="text-[11px] text-slate-500 block text-center mb-1">Học Sinh</label>
              <input type="number" id="c2_hs" value="0" min="0" oninput="calcTotal()" class="w-full border border-slate-300 rounded-xl p-2 text-center text-sm font-bold">
            </div>
            <div>
              <label class="text-[11px] text-slate-500 block text-center mb-1">Phụ Huynh</label>
              <input type="number" id="c2_ph" value="0" min="0" oninput="calcTotal()" class="w-full border border-slate-300 rounded-xl p-2 text-center text-sm font-bold">
            </div>
            <div>
              <label class="text-[11px] text-slate-500 block text-center mb-1">Trẻ Em Đi Kèm</label>
              <input type="number" id="c2_te" value="0" min="0" oninput="calcTotal()" class="w-full border border-slate-300 rounded-xl p-2 text-center text-sm font-bold">
            </div>
          </div>
        </div>

        <!-- Giáo viên & Trạng thái -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-medium text-slate-600">Số Lượng Giáo Viên</label>
              <input type="number" id="teachers" value="0" min="0" oninput="calcTotal()" class="w-full mt-1 border border-slate-300 rounded-xl p-2 text-sm font-bold">
            </div>
            <div>
              <label class="text-xs font-medium text-slate-600">Trạng Thái Xe</label>
              <select id="status" class="w-full mt-1 border border-slate-300 rounded-xl p-2 text-sm font-medium bg-slate-50">
                <option value="Đang xuất phát">Đang xuất phát</option>
                <option value="Đã nhận phòng">Đã nhận phòng</option>
                <option value="Đã trả phòng">Đã trả phòng</option>
                <option value="Đã về tới trường">Đã về tới trường</option>
              </select>
            </div>
          </div>

          <div class="bg-blue-50 p-3.5 rounded-xl flex justify-between items-center border border-blue-100">
            <span class="text-xs font-bold text-blue-900 uppercase">TỔNG SĨ SỐ TOÀN XE:</span>
            <span id="displayTotal" class="text-2xl font-black text-blue-600">0</span>
          </div>
        </div>

        <!-- Nút Lưu -->
        <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-2xl shadow-lg transition-all active:scale-[0.98]">
          LƯU & CẬP NHẬT
        </button>
      </form>
    </div>

    <!-- MÀN HÌNH ADMIN -->
    <div id="adminSection" class="hidden space-y-4">
      <div class="bg-slate-800 text-white p-4 rounded-2xl flex justify-between items-center shadow-lg">
        <div>
          <h2 class="font-bold text-base text-amber-400">TRANG QUẢN TRỊ VIÊN</h2>
          <p id="adminTourName" class="text-xs text-slate-300">Đang xem tổng hợp cả đoàn</p>
        </div>
        <button onclick="exitAdmin()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg border border-slate-500 font-medium">
          ← Về form nhập
        </button>
      </div>

      <div id="adminTotalBox" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <div class="text-xs text-slate-500 font-bold uppercase">Tổng Quân Số Cả Đoàn</div>
        <div id="adminTotalNumber" class="text-3xl font-black text-blue-600 mt-1">0 người</div>
      </div>

      <div id="adminCarList" class="space-y-3"></div>
    </div>
  </div>

  <script>
    var isSubmitting = false;

    function formatCarName(val) {
      val = (val || '').trim();
      if (!val) return '';
      if (/^xe\b/i.test(val) || /^xe\s+/i.test(val)) return val.replace(/^xe\s*/i, 'Xe ');
      if (/^\d+$/.test(val)) return 'Xe ' + val;
      if (/^lớp\b/i.test(val) || /^lớp\s+/i.test(val)) return val.replace(/^lớp\s*/i, 'Lớp ');
      return 'Lớp ' + val;
    }

    function normalizeCarInput(inputEl) {
      inputEl.value = formatCarName(inputEl.value);
    }

    window.onload = function() {
      fetch(API_URL + "?action=getActiveTours")
        .then(res => res.json())
        .then(res => {
          var tours = res.data || [];
          var select = document.getElementById('tour');
          select.innerHTML = '';
          if (tours.length === 0) {
            select.innerHTML = '<option value="">Chưa có tour Đang/Sắp diễn ra</option>';
            return;
          }
          tours.forEach(t => {
            var opt = document.createElement('option');
            opt.value = t;
            opt.innerText = t;
            select.appendChild(opt);
          });

          var savedTour = localStorage.getItem('user_tour');
          var savedCar = localStorage.getItem('user_car');
          if (savedTour && tours.includes(savedTour)) select.value = savedTour;
          if (savedCar) {
            document.getElementById('carInput').value = savedCar;
            document.getElementById('lockBadge').classList.remove('hidden');
            loadSavedCarData();
          }
        })
        .catch(err => {
          console.error(err);
          alert("Lỗi kết nối máy chủ API!");
        });
    };

    function handleTourChange() { loadSavedCarData(); }
    function handleCarChange() { loadSavedCarData(); }

    function loadSavedCarData() {
      var tour = document.getElementById('tour').value;
      var carVal = document.getElementById('carInput').value.trim();
      if (!tour || !carVal) return;

      var fullCarName = formatCarName(carVal);
      document.getElementById('carInput').value = fullCarName;

      fetch(API_URL + "?action=getVehicleData&tour=" + encodeURIComponent(tour) + "&car=" + encodeURIComponent(fullCarName))
        .then(res => res.json())
        .then(res => {
          var data = res.data;
          if (data) {
            document.getElementById('plate').value = data.plate || '';
            document.getElementById('driver').value = data.driver || '';
            document.getElementById('driverPhone').value = data.driverPhone || '';
            document.getElementById('guide').value = data.guide || '';
            document.getElementById('c1_name').value = data.c1_name || '';
            document.getElementById('c1_hs').value = data.c1_hs || 0;
            document.getElementById('c1_ph').value = data.c1_ph || 0;
            document.getElementById('c1_te').value = data.c1_te || 0;
            document.getElementById('c2_name').value = data.c2_name || '';
            document.getElementById('c2_hs').value = data.c2_hs || 0;
            document.getElementById('c2_ph').value = data.c2_ph || 0;
            document.getElementById('c2_te').value = data.c2_te || 0;
            document.getElementById('teachers').value = data.teachers || 0;
            document.getElementById('status').value = data.status || 'Đang xuất phát';
            calcTotal();
          }
        });
    }

    function calcTotal() {
      var c1 = (Number(document.getElementById('c1_hs').value)||0) + (Number(document.getElementById('c1_ph').value)||0) + (Number(document.getElementById('c1_te').value)||0);
      var c2 = (Number(document.getElementById('c2_hs').value)||0) + (Number(document.getElementById('c2_ph').value)||0) + (Number(document.getElementById('c2_te').value)||0);
      var gv = Number(document.getElementById('teachers').value)||0;
      document.getElementById('displayTotal').innerText = c1 + c2 + gv;
    }

    function submitData(e) {
      e.preventDefault();
      if (isSubmitting) return;

      var btn = document.getElementById('btnSubmit');
      isSubmitting = true;
      btn.disabled = true;
      btn.innerText = "Đang lưu qua API...";

      var fullCarName = formatCarName(document.getElementById('carInput').value);
      document.getElementById('carInput').value = fullCarName;

      var payload = {
        action: 'saveVehicleData',
        data: {
          tour: document.getElementById('tour').value,
          carNumber: fullCarName,
          plate: document.getElementById('plate').value,
          driver: document.getElementById('driver').value,
          driverPhone: document.getElementById('driverPhone').value,
          guide: document.getElementById('guide').value,
          c1_name: document.getElementById('c1_name').value,
          c1_hs: document.getElementById('c1_hs').value,
          c1_ph: document.getElementById('c1_ph').value,
          c1_te: document.getElementById('c1_te').value,
          c2_name: document.getElementById('c2_name').value,
          c2_hs: document.getElementById('c2_hs').value,
          c2_ph: document.getElementById('c2_ph').value,
          c2_te: document.getElementById('c2_te').value,
          teachers: document.getElementById('teachers').value,
          status: document.getElementById('status').value
        }
      };

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        isSubmitting = false;
        btn.disabled = false;
        btn.innerText = "LƯU & CẬP NHẬT";
        if (res.success) {
          localStorage.setItem('user_tour', payload.data.tour);
          localStorage.setItem('user_car', fullCarName);
          document.getElementById('lockBadge').classList.remove('hidden');
          alert("Đã cập nhật thành công! Tổng sĩ số: " + res.total + " người.");
        } else {
          alert("Lỗi: " + res.message);
        }
      })
      .catch(err => {
        isSubmitting = false;
        btn.disabled = false;
        btn.innerText = "LƯU & CẬP NHẬT";
        alert("Lỗi kết nối khi gửi dữ liệu!");
      });
    }

    function promptAdmin() {
      var pin = prompt("Vui lòng nhập mã số Quản lý Admin:");
      if (!pin) return;
      if (pin === "8888") {
        switchToAdminView(pin);
      } else {
        alert("Mã số Admin không đúng!");
      }
    }

    function switchToAdminView(pin) {
      var tour = document.getElementById('tour').value;
      fetch(API_URL + "?action=getAdminReport&tour=" + encodeURIComponent(tour) + "&pin=" + encodeURIComponent(pin))
        .then(res => res.json())
        .then(res => {
          if (!res.success) {
            alert(res.message);
            return;
          }
          var list = res.data || [];
          document.getElementById('userSection').classList.add('hidden');
          document.getElementById('adminSection').classList.remove('hidden');
          document.getElementById('adminTourName').innerText = "Tour: " + (tour || "Toàn bộ");

          var totalAll = list.reduce((sum, item) => sum + Number(item.total), 0);
          document.getElementById('adminTotalNumber').innerText = totalAll + " người (" + list.length + " xe/lớp)";

          var container = document.getElementById('adminCarList');
          var html = '';
          if (list.length === 0) {
            html = '<div class="text-center py-6 text-slate-400 text-sm">Chưa có xe nào cập nhật dữ liệu.</div>';
          } else {
            list.forEach(x => {
              html += '<div class="bg-white border border-slate-200 rounded-2xl p-4 space-y-2 text-xs shadow-sm">' +
                      '<div class="flex justify-between items-center font-bold text-sm text-slate-800">' +
                      '<span>' + x.carNumber + ' (' + (x.plate || 'Chưa có biển') + ')</span>' +
                      '<span class="text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full font-black text-sm border border-blue-100">' + x.total + ' người</span>' +
                      '</div>' +
                      '<div>Trạng thái: <span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold text-[11px]">' + x.status + '</span></div>' +
                      '<div>HDV: <b>' + x.guide + '</b> | TX: ' + x.driver + ' (<a href="tel:' + x.driverPhone + '" class="text-blue-600 font-bold underline">' + x.driverPhone + '</a>)</div>' +
                      '<div class="text-slate-500 bg-slate-50 p-2 rounded-lg">' + x.c1 + ' | ' + x.c2 + ' | GV: ' + x.teachers + '</div>' +
                      '<div class="text-[10px] text-slate-400">Cập nhật lúc: ' + x.time + '</div>' +
                      '</div>';
            });
          }
          container.innerHTML = html;
        })
        .catch(() => alert("Không thể tải báo cáo từ máy chủ!"));
    }

    function exitAdmin() {
      document.getElementById('adminSection').classList.add('hidden');
      document.getElementById('userSection').classList.remove('hidden');
    }
  </script>
</body>
</html>
